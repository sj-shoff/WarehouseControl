version: '3.8'

services:
  warehouse:
    build: .
    container_name: warehouse-control
    env_file: .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      warehouse-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - warehouse-net

  warehouse-db:
    image: postgres:15-alpine
    container_name: warehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_WAREHOUSE}
    volumes:
      - warehouse_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - warehouse-net

networks:
  warehouse-net:
    external: true

volumes:
  warehouse_pg_data: