version: '3.8'

services:
  sso:
    build: .
    container_name: sso
    env_file: .env
    ports:
      - "${GRPC_PORT}:44044"
    depends_on:
      sso-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - warehouse-net

  sso-db:
    image: postgres:15-alpine
    container_name: sso-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_SSO}
    volumes:
      - sso_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - warehouse-net

networks:
  warehouse-net:
    external: true

volumes:
  sso_pg_data: